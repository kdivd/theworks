name: theworks
description: "the platform to help you get a internship!"
publish_to: 'none'

version: 0.0.5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.1.1
  firebase_auth: ^6.0.2
  firebase_performance: ^0.11.1
  choice: ^2.3.2
  cloud_firestore: ^6.1.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/TESTLOGO.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/testgrad.png
    - assets/images/TESTLOGO.png
    - assets/tags.json

  fonts:
    - family: KumbhSans
      fonts:
        - asset: assets/fonts/KumbhSans.ttf
